services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigdu
      POSTGRES_PASSWORD: sigdu_dev
      POSTGRES_DB: sigdu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigdu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sigdu:sigdu_dev@db:5432/sigdu
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-cambiar-en-produccion}
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
    command: >
      sh -c "cd /code && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/hooks:/app/hooks

volumes:
  pgdata:
